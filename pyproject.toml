[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fintracka"
version = "0.1.0"
description = "Local-first personal finance ledger"
readme = "PROJECT_SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143,<0.144",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9.1,<10",
]

[project.scripts]
fintracka = "fintracka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fintracka = ["migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

